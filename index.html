<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #312e2b; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* ÜST BAR */
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: #262421; flex-shrink: 0; }
  .header-left { display: flex; flex-direction: column; justify-content: center; }
  .logo { font-weight: 700; font-size: 18px; display: flex; align-items: center; color: #fff; }
  .logo-icon { color: #81b64c; font-size: 22px; margin-right: 6px; }
  .subtitle { font-size: 11px; color: #81b64c; letter-spacing: 1.5px; font-weight: 600; margin-left: 28px; margin-top: 2px; }
  .rating-box { background: #3d3a37; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 14px; color: #f0d9b5; border: 1px solid #555; }
  .rating-box span { color: #81b64c; }

  /* EĞİTMEN ALANI */
  .coach-area { display: flex; align-items: center; padding: 12px 16px; gap: 12px; background-color: #2a2825; flex-shrink: 0; z-index: 10; }
  .avatar-container { position: relative; width: 45px; height: 45px; flex-shrink: 0; }
  .avatar-img { width: 100%; height: 100%; border-radius: 8px; background: url('https://api.dicebear.com/7.x/bottts/svg?seed=ChessBot&backgroundColor=81b64c') no-repeat center; background-size: cover; }
  .speech-bubble { background: #fff; color: #000; padding: 10px 14px; border-radius: 8px; border-bottom-left-radius: 0; font-size: 13px; font-weight: 500; line-height: 1.3; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.2); min-height: 42px; display: flex; align-items: center; }

  /* TAHTA ALANI */
  .board-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 8px; width: 100%; min-height: 0; }
  #board { width: 100%; max-width: 500px; aspect-ratio: 1 / 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border-radius: 4px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; touch-action: none; }
  .square { position: relative; display: flex; align-items: center; justify-content: center; }
  .square.light { background-color: #EBECD0; }
  .square.dark { background-color: #739552; }
  
  /* Vurgular */
  .square.last-move::before { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 0, 0.4); }
  .square.selected::before { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 0, 0.6); }
  .square.move-target::after { content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(0,0,0,0.15); }
  .square.capture-target::after { content: ''; position: absolute; inset: 4%; border: 6px solid rgba(0,0,0,0.15); border-radius: 50%; }

  /* ŞAH ÇEKME VE MAT EFEKTLERİ */
  .square.in-check::after { 
    content: ''; position: absolute; inset: 0; 
    background: radial-gradient(circle, rgba(255,0,0,0.1) 20%, rgba(255,0,0,0.8) 100%); 
    animation: smooth-pulse 1.5s ease-in-out infinite; 
    pointer-events: none; z-index: 1; 
  }
  .square.checkmate { background-color: #ff4d4d !important; }
  @keyframes smooth-pulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

  /* TAŞLAR */
  .piece { width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; position: relative; z-index: 2; cursor: pointer; }
  .dragging-piece { position: fixed !important; z-index: 1000 !important; pointer-events: none; transform: translate(-50%, -50%) scale(1.1); cursor: grabbing; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5)); }
  .ghost-piece { position: fixed !important; z-index: 999 !important; pointer-events: none; transition: transform 0.2s ease-in-out; }

  .w-p { background-image: url('https://lichess1.org/assets/piece/cburnett/wP.svg'); } .w-n { background-image: url('https://lichess1.org/assets/piece/cburnett/wN.svg'); } .w-b { background-image: url('https://lichess1.org/assets/piece/cburnett/wB.svg'); } .w-r { background-image: url('https://lichess1.org/assets/piece/cburnett/wR.svg'); } .w-q { background-image: url('https://lichess1.org/assets/piece/cburnett/wQ.svg'); } .w-k { background-image: url('https://lichess1.org/assets/piece/cburnett/wK.svg'); }
  .b-p { background-image: url('https://lichess1.org/assets/piece/cburnett/bP.svg'); } .b-n { background-image: url('https://lichess1.org/assets/piece/cburnett/bN.svg'); } .b-b { background-image: url('https://lichess1.org/assets/piece/cburnett/bB.svg'); } .b-r { background-image: url('https://lichess1.org/assets/piece/cburnett/bR.svg'); } .b-q { background-image: url('https://lichess1.org/assets/piece/cburnett/bQ.svg'); } .b-k { background-image: url('https://lichess1.org/assets/piece/cburnett/bK.svg'); }

  /* ALT BİLGİ VE MENÜ */
  .bottom-info { display: flex; justify-content: space-between; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #9c9894; flex-shrink: 0; background-color: #262421; }
  .bottom-nav { display: flex; justify-content: space-around; align-items: center; padding: 8px 0 16px 0; background-color: #262421; flex-shrink: 0; border-top: 1px solid #3d3a37; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9c9894; font-size: 11px; font-weight: 600; cursor: pointer; background: none; border: none; outline: none; width: 20%; }
  .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .nav-btn:active { transform: scale(0.95); color: #fff; }

  /* TAM EKRAN ONLINE MENÜSÜ */
  #onlineScreen { display: none; position: fixed; inset: 0; background: #262421; z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .online-box { background: #1a1816; border: 1px solid #444; border-radius: 8px; padding: 20px; width: 100%; max-width: 350px; text-align: center; }
  .online-box h3 { color: #81b64c; margin-bottom: 15px; font-size: 20px; }
  .online-box p { color: #ccc; margin-bottom: 15px; font-size: 14px; }
  .online-input { width: 100%; padding: 15px; font-size: 20px; text-align: center; background: #000; color: #fff; border: 1px solid #555; border-radius: 6px; margin-bottom: 15px; letter-spacing: 2px; text-transform: uppercase; }
  .action-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: #fff; background: #3d3a37; border: none; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
  .action-btn.green { background: #81b64c; }
  .action-btn.red { background: #d9534f; }
  
  /* SEVİYE MODAL */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
  .modal-content { background: #262421; border-radius: 8px; padding: 20px; width: 100%; max-width: 320px; text-align: center; }
  .modal-content h3 { margin-bottom: 15px; font-size: 18px; }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .diff-btn { padding: 12px; background: #3d3a37; border: none; color: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .diff-btn.active { background: #81b64c; }
  .diff-btn.wide { grid-column: span 2; }
  .close-btn { margin-top: 10px; background: transparent; color: #9c9894; border: none; font-size: 14px; cursor: pointer; }
</style>

<script>
  window.onerror = function(msg) { console.log("Hata:", msg); };

  const firebaseConfig = {
    apiKey: "AIzaSyA0OhCbYtZuo4yFPCJrsb7SI9XIHVE9SUU",
    authDomain: "play-chess-1348f.firebaseapp.com",
    databaseURL: "https://play-chess-1348f-default-rtdb.firebaseio.com",
    projectId: "play-chess-1348f",
    storageBucket: "play-chess-1348f.firebasestorage.app",
    messagingSenderId: "588951342298",
    appId: "1:588951342298:web:8439254dc667258679a9e3"
  };

  let db = null;
  try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) { console.log(e); }

  // PUAN SİSTEMİ
  let playerPoints = parseInt(localStorage.getItem('selcukPoints')) || 0;
  const ratingEl = document.getElementById('playerRating');
  ratingEl.innerText = playerPoints;
  if(playerPoints > 0) {
    document.getElementById('coachText').innerHTML = `Hoş geldin Selçuk! Mevcut Puanın: <b>${playerPoints}</b>. Hadi kazanmaya devam et!`;
  }

  function calculatePoints(win) {
    if (win) {
      let base = 60;
      let multiplier = 1;
      if (difficulty === 'veryEasy') multiplier = 0.2;
      if (difficulty === 'easy') multiplier = 0.5;
      if (difficulty === 'medium') multiplier = 1;
      if (difficulty === 'hard') multiplier = 1.5;
      if (difficulty === 'veryHard') multiplier = 2.5;
      
      let gain = Math.max(5, Math.round((base - (playerPoints * 0.03)) * multiplier));
      playerPoints += gain;
      localStorage.setItem('selcukPoints', playerPoints);
      ratingEl.innerText = playerPoints;
      return `+${gain}`;
    } else {
      let loss = Math.max(5, Math.round(10 + (playerPoints * 0.02)));
      playerPoints = Math.max(0, playerPoints - loss);
      localStorage.setItem('selcukPoints', playerPoints);
      ratingEl.innerText = playerPoints;
      return `-${loss}`;
    }
  }

  const FILES = ['a','b','c','d','e','f','g','h'];
  let chess = new Chess();
  let playerColor = 'w';
  let difficulty = 'medium';
  let selectedSq = null;
  let legalTargets = [];
  let lastMove = null;
  let thinking = false;
  let gameOver = false;

  let isAnimating = false;
  let isDragging = false;
  let dragStartSq = null;
  let dragStartX = 0, dragStartY = 0;

  let isOnlineMode = false;
  let currentRoomCode = null;
  let myOnlineColor = 'w';
  let roomRef = null;

  const boardEl = document.getElementById('board');
  const coachTextEl = document.getElementById('coachText');
  const turnInfoEl = document.getElementById('turnInfo');
  const scoreInfo = document.getElementById('scoreInfo');

  const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_mp3_/default/move-self.mp3');
  const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_mp3_/default/capture.mp3');
  const checkSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_mp3_/default/move-check.mp3');

  const LEVELS = {
    veryEasy: { depth: 1, blunder: 0.40, margin: 400 },
    easy:     { depth: 1, blunder: 0.15, margin: 160 },
    medium:   { depth: 2, blunder: 0.05, margin: 60 },
    hard:     { depth: 3, blunder: 0.00, margin: 0 },
    veryHard: { depth: 4, blunder: 0.00, margin: 0 }
  };
  const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
  const PST = {
    p: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
    n: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
    b: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
    r: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
    q: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
    k: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]
  };

  function evaluate(g) {
    const b = g.board(); let s = 0;
    for (let r=0; r<8; r++) for (let c=0; c<8; c++) {
      const p = b[r][c]; if(!p) continue;
      const idx = (p.color === 'w') ? (r * 8 + c) : ((7 - r) * 8 + c);
      const val = PIECE_VALUES[p.type] + PST[p.type][idx];
      s += (p.color === 'w' ? val : -val);
    }
    return s;
  }

  const MATE = 100000;
  let nodes = 0, aborted = false, searchDeadline = 0;

  function moveOrderScore(m) {
    let s = 0;
    if (m.captured) s += 10 * PIECE_VALUES[m.captured] - PIECE_VALUES[m.piece];
    if (m.promotion) s += PIECE_VALUES[m.promotion];
    if (m.san && m.san.includes('+')) s += 60;
    return s;
  }

  function negamax(g, depth, alpha, beta, ply) {
    if (aborted) return 0;
    nodes++;
    if ((nodes & 1023) === 0 && performance.now() > searchDeadline) { aborted = true; return 0; }
    if (depth <= 0) return g.turn() === 'w' ? evaluate(g) : -evaluate(g);
    
    const moves = g.moves({ verbose: true });
    if (moves.length === 0) return g.in_check() ? -(MATE - ply) : 0;
    moves.sort((a, b) => moveOrderScore(b) - moveOrderScore(a));

    let best = -Infinity;
    for (let i = 0; i < moves.length; i++) {
      g.move(moves[i]);
      const val = -negamax(g, depth - 1, -beta, -alpha, ply + 1);
      g.undo();
      if (aborted) return 0;
      if (val > best) best = val;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  function chooseAIMove() {
    const cfg = LEVELS[difficulty];
    const moves = chess.moves({ verbose: true });
    if (moves.length === 0) return null;
    if (cfg.blunder > 0 && Math.random() < cfg.blunder) return moves[(Math.random() * moves.length) | 0];

    searchDeadline = performance.now() + 2000;
    let bestMove = moves[0], scored = null;
    const ordered = moves.slice().sort((a, b) => moveOrderScore(b) - moveOrderScore(a));

    for (let d = 1; d <= cfg.depth; d++) {
      aborted = false; nodes = 0; const list = [];
      for (let i = 0; i < ordered.length; i++) {
        chess.move(ordered[i]);
        const val = -negamax(chess, d - 1, -Infinity, Infinity, 1);
        chess.undo();
        if (aborted) break;
        list.push({ m: ordered[i], val: val });
      }
      if (aborted) break;
      list.sort((a, b) => b.val - a.val);
      scored = list; bestMove = list[0].m;
    }
    if (scored && cfg.margin > 0) {
      const bestVal = scored[0].val;
      const pool = scored.filter(s => s.val >= bestVal - cfg.margin);
      if (pool.length > 0) return pool[(Math.random() * pool.length) | 0].m;
    }
    return bestMove;
  }

  function render() {
    boardEl.innerHTML = '';
    
    const inCheck = chess.in_check();
    const inCheckmate = chess.in_checkmate();
    let kingSquare = null;
    
    if (inCheck || inCheckmate) {
      const turnColor = chess.turn();
      const b = chess.board();
      for (let r=0; r<8; r++) for (let c=0; c<8; c++) {
        const p = b[r][c];
        if (p && p.type === 'k' && p.color === turnColor) {
          kingSquare = FILES[c] + (8 - r);
        }
      }
    }

    for (let i = 0; i < 64; i++) {
      const row = Math.floor(i / 8), col = i % 8;
      const rank = 7 - row;
      const sqName = FILES[col] + (rank + 1);
      const isLight = ((col + rank) % 2) === 0;
      
      const sqEl = document.createElement('div');
      sqEl.className = 'square ' + (isLight ? 'light' : 'dark');
      sqEl.dataset.sq = sqName;
      
      if (lastMove && (lastMove.from === sqName || lastMove.to === sqName)) sqEl.classList.add('last-move');
      if (selectedSq === sqName) sqEl.classList.add('selected');
      if (legalTargets.includes(sqName)) sqEl.classList.add(chess.get(sqName) ? 'capture-target' : 'move-target');

      if (kingSquare === sqName) {
        if (inCheckmate) sqEl.classList.add('checkmate');
        else if (inCheck) sqEl.classList.add('in-check');
      }

      const piece = chess.get(sqName);
      if (piece) {
        const pEl = document.createElement('div');
        pEl.className = 'piece ' + piece.color + '-' + piece.type;
        pEl.addEventListener('pointerdown', (e) => onPointerDown(e, sqName));
        sqEl.appendChild(pEl);
      }
      
      sqEl.addEventListener('click', () => { if (!isDragging) onSquareClick(sqName); });
      boardEl.appendChild(sqEl);
    }
  }

  function playSound(type) {
    try {
      if (type === 'move') { moveSound.currentTime = 0; moveSound.play(); }
      if (type === 'capture') { captureSound.currentTime = 0; captureSound.play(); }
      if (type === 'check') { checkSound.currentTime = 0; checkSound.play(); }
    } catch(e) {}
  }

  function onPointerDown(e, sq) {
    if (thinking || isAnimating || chess.game_over() || chess.turn() !== playerColor) return;
    const piece = chess.get(sq);
    if (!piece || piece.color !== playerColor) return;
    dragStartSq = sq; dragStartX = e.clientX; dragStartY = e.clientY; isDragging = false;
  }

  window.addEventListener('pointermove', (e) => {
    if (!dragStartSq) return;
    if (!isDragging) {
      if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 5) {
        isDragging = true;
        selectedSq = dragStartSq;
        legalTargets = chess.moves({ square: dragStartSq, verbose: true }).map(m => m.to);
        render();
        const sqEl = boardEl.querySelector(`[data-sq="${dragStartSq}"]`);
        if (sqEl) {
          const pEl = sqEl.querySelector('.piece');
          if (pEl) {
            const rect = pEl.getBoundingClientRect();
            pEl.style.width = rect.width + 'px'; pEl.style.height = rect.height + 'px';
            pEl.classList.add('dragging-piece');
          }
        }
      }
    }
    if (isDragging) {
      const pEl = document.querySelector('.dragging-piece');
      if (pEl) { pEl.style.left = e.clientX + 'px'; pEl.style.top = e.clientY + 'px'; }
    }
  });

  window.addEventListener('pointerup', (e) => {
    if (!dragStartSq) return;
    if (isDragging) {
      const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
      let targetSq = null;
      if (dropTarget) {
        if (dropTarget.classList.contains('square')) targetSq = dropTarget.dataset.sq;
        else if (dropTarget.classList.contains('piece')) targetSq = dropTarget.parentElement.dataset.sq;
      }
      if (targetSq && legalTargets.includes(targetSq)) {
        executeMove(dragStartSq, targetSq, false);
      } else { selectedSq = null; legalTargets = []; render(); }
      setTimeout(() => { isDragging = false; }, 50);
    }
    dragStartSq = null;
  });

  function onSquareClick(sq) {
    if (thinking || isAnimating || chess.game_over() || chess.turn() !== playerColor || isDragging) return;
    if (selectedSq && legalTargets.includes(sq)) { executeMove(selectedSq, sq, true); return; }
    const piece = chess.get(sq);
    if (piece && piece.color === playerColor) {
      if (selectedSq === sq) { selectedSq = null; legalTargets = []; }
      else { selectedSq = sq; legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to); }
      render();
    } else { selectedSq = null; legalTargets = []; render(); }
  }

  function animatePieceMove(from, to, callback) {
    const fromSquare = boardEl.querySelector(`[data-sq="${from}"]`);
    const toSquare = boardEl.querySelector(`[data-sq="${to}"]`);
    if (!fromSquare || !toSquare) { callback(); return; }
    const fromPiece = fromSquare.querySelector('.piece');
    const toPiece = toSquare.querySelector('.piece');
    if (!fromPiece) { callback(); return; }
    if (toPiece) toPiece.style.opacity = '0';
    fromPiece.style.opacity = '0';
    const fromRect = fromPiece.getBoundingClientRect();
    const toRect = toSquare.getBoundingClientRect();
    const ghost = document.createElement('div');
    ghost.className = fromPiece.className + ' ghost-piece';
    ghost.style.left = fromRect.left + 'px'; ghost.style.top = fromRect.top + 'px';
    ghost.style.width = fromRect.width + 'px'; ghost.style.height = fromRect.height + 'px';
    document.body.appendChild(ghost);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        ghost.style.transform = `translate(${toRect.left - fromRect.left}px, ${toRect.top - fromRect.top}px)`;
      });
    });
    setTimeout(() => { ghost.remove(); callback(); }, 200);
  }

  function executeMove(from, to, animate = true) {
    if (isAnimating) return;
    const isCapture = !!chess.get(to);
    selectedSq = null; legalTargets = [];
    
    const doMove = () => {
      const move = chess.move({ from, to, promotion: 'q' });
      if (move) {
        if (chess.in_checkmate()) playSound('check'); 
        else if (chess.in_check()) playSound('check');
        else if (isCapture) playSound('capture');
        else playSound('move');
        
        lastMove = move; isAnimating = false;
        render(); updateUI();
        
        if (isOnlineMode && roomRef) {
           // Firebase'e hamleyi kaydet
           roomRef.update({ fen: chess.fen(), lastMove: JSON.stringify(move) }).catch(e => alert("Gönderilemedi: " + e.message));
        } else if (!isOnlineMode && !checkGameEnd()) {
           thinking = true;
           setTimeout(aiTurn, 100);
        }
      } else { isAnimating = false; render(); }
    };

    if (animate) { isAnimating = true; animatePieceMove(from, to, doMove); } 
    else { doMove(); }
  }

  function aiTurn() {
    if (chess.game_over() || isOnlineMode) { thinking = false; return; }
    const move = chooseAIMove();
    if (move) {
      const isCapture = !!chess.get(move.to);
      isAnimating = true;
      animatePieceMove(move.from, move.to, () => {
        chess.move(move); lastMove = move;
        if (chess.in_checkmate()) playSound('check');
        else if (chess.in_check()) playSound('check');
        else if (isCapture) playSound('capture');
        else playSound('move');
        
        isAnimating = false; thinking = false;
        selectedSq = null; legalTargets = [];
        render(); updateUI(); checkGameEnd();
      });
    } else { thinking = false; }
  }

  function updateUI() {
    turnInfoEl.textContent = 'Sıra: ' + (chess.turn() === 'w' ? 'Beyaz' : 'Siyah');
    let score = evaluate(chess);
    if (score === 0) scoreInfo.textContent = '🤝 Eşit';
    else if (score > 0) scoreInfo.textContent = `👑 +${Math.round(score/100)}`;
    else scoreInfo.textContent = `👑 -${Math.round(Math.abs(score)/100)}`;
    updateCoach();
  }

  function updateCoach() {
    if (chess.game_over() || chess.turn() !== playerColor) return;
    if (chess.in_check()) { coachTextEl.innerHTML = '<b>Şahın tehdit altında!</b> Şahı güvenli bir yere götür.'; return; }
    
    const tips = [
      'Merkezi kontrol etmeye çalış.',
      'At ve fillerini geliştir, şahını koru.',
      'Korumasız taş bırakmamaya dikkat et.',
      'Açık sütunlara kalelerini yerleştir.',
      'Taşların birbirini korusun.'
    ];
    coachTextEl.innerHTML = tips[Math.floor(Math.random() * tips.length)];
  }

  function checkGameEnd() {
    if (gameOver) return true;
    
    if (chess.in_checkmate()) {
      gameOver = true;
      const playerWon = chess.turn() !== playerColor;
      const pointChange = calculatePoints(playerWon);
      
      if (playerWon) {
        coachTextEl.innerHTML = `<b>Mat! Kazandın!</b> 🎉 Puan değişimi: <b>${pointChange}</b>`;
      } else {
        coachTextEl.innerHTML = `<b>Mat! Kaybettin.</b> Puan değişimi: <b>${pointChange}</b>`;
      }
      return true;
    }
    if (chess.in_draw() || chess.in_stalemate()) { 
      gameOver = true;
      coachTextEl.innerHTML = '<b>Berabere.</b>'; 
      return true; 
    }
    return false;
  }

  // ARAYÜZ OLAYLARI
  document.getElementById('btnOnlineModal').addEventListener('click', () => {
    document.getElementById('onlineScreen').style.display = 'flex';
    document.getElementById('boxMain').style.display = 'block';
    document.getElementById('boxWait').style.display = 'none';
  });
  document.getElementById('btnCloseOnline').addEventListener('click', () => document.getElementById('onlineScreen').style.display = 'none');
  document.getElementById('btnOptionsModal').addEventListener('click', () => document.getElementById('optionsModal').style.display = 'flex');
  document.getElementById('closeOptions').addEventListener('click', () => document.getElementById('optionsModal').style.display = 'none');

  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      difficulty = e.target.dataset.level;
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById('optionsModal').style.display = 'none';
      coachTextEl.innerText = 'Seviye değiştirildi: ' + e.target.innerText;
    });
  });

  // ONLINE OYUN MANTIĞI (BASİT VE SAĞLAM)
  function createRoom(color) {
    if (!db) { alert("Veritabanı bağlantısı yok!"); return; }
    currentRoomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
    myOnlineColor = color; playerColor = myOnlineColor; isOnlineMode = true; gameOver = false; chess = new Chess();
    lastMove = null; selectedSq = null; legalTargets = [];

    roomRef = db.ref('rooms/' + currentRoomCode);
    roomRef.set({ fen: chess.fen(), creatorColor: myOnlineColor, lastMove: null }).then(() => {
        document.getElementById('boxMain').style.display = 'none';
        document.getElementById('boxWait').style.display = 'block';
        document.getElementById('roomCodeDisplay').innerText = currentRoomCode;
        render(); updateUI();
    }).catch(e => alert("Oda kurulamadı! Veritabanı kurallarını 'Test Modu' yaptığından emin ol.\nHata: " + e.message));

    roomRef.on('value', (snap) => {
      const data = snap.val();
      if (!data) return;
      // Eğer rakip hamle yaptıysa
      if (data.fen !== chess.fen()) {
        chess.load(data.fen);
        lastMove = data.lastMove ? JSON.parse(data.lastMove) : null;
        render(); updateUI(); checkGameEnd();
        document.getElementById('onlineScreen').style.display = 'none';
        coachTextEl.innerHTML = "Rakip hamle yaptı. Sıra sende!";
      }
    });
  }

  document.getElementById('btnCreateRoom').addEventListener('click', () => createRoom('w'));
  document.getElementById('btnCreateRoomBlack').addEventListener('click', () => createRoom('b'));

  document.getElementById('btnCancelRoom').addEventListener('click', () => {
    if (currentRoomCode && db) db.ref('rooms/' + currentRoomCode).remove();
    isOnlineMode = false; currentRoomCode = null;
    document.getElementById('onlineScreen').style.display = 'none';
    resetGame();
  });

  document.getElementById('btnJoinRoom').addEventListener('click', () => {
    if (!db) { alert("Veritabanı bağlantısı yok!"); return; }
    const code = document.getElementById('inputJoinCode').value.toUpperCase().trim();
    if (code.length < 4) { alert("Geçerli bir kod girin."); return; }
    
    const testRef = db.ref('rooms/' + code);
    testRef.once('value').then((snapshot) => {
      const data = snapshot.val();
      if (!data) { alert("Böyle bir oda yok!"); return; }
      
      currentRoomCode = code; isOnlineMode = true; gameOver = false;
      myOnlineColor = data.creatorColor === 'w' ? 'b' : 'w'; playerColor = myOnlineColor;
      roomRef = testRef;
      
      chess.load(data.fen);
      lastMove = data.lastMove ? JSON.parse(data.lastMove) : null;
      render(); updateUI();
      
      document.getElementById('onlineScreen').style.display = 'none';
      coachTextEl.innerHTML = `Odaya katıldın! Rengin: ${myOnlineColor === 'w' ? 'Beyaz' : 'Siyah'}`;

      // Gelen hamleleri dinle
      roomRef.on('value', (snap) => {
        const d = snap.val();
        if (d && d.fen && d.fen !== chess.fen()) {
           chess.load(d.fen);
           lastMove = d.lastMove ? JSON.parse(d.lastMove) : null;
           render(); updateUI(); checkGameEnd();
           coachTextEl.innerHTML = "Rakip hamle yaptı. Sıra sende!";
        }
      });
    }).catch(e => alert("Hata: " + e.message));
  });

  function resetGame() {
    if (currentRoomCode && db) db.ref('rooms/' + currentRoomCode).remove();
    isOnlineMode = false; currentRoomCode = null; playerColor = 'w'; chess = new Chess();
    lastMove = null; selectedSq = null; legalTargets = []; thinking = false; gameOver = false;
    render(); updateUI();
    coachTextEl.innerText = 'Yeni oyun başladı. Hadi göster kendini!';
  }

  document.getElementById('btnNew').addEventListener('click', resetGame);
  document.getElementById('btnUndo').addEventListener('click', () => {
    if (isOnlineMode) { alert("Online modda geri alma yoktur!"); return; }
    if (thinking || isAnimating || chess.history().length === 0) return;
    gameOver = false;
    chess.undo(); if (chess.turn() !== playerColor && chess.history().length > 0) chess.undo();
    const h = chess.history({ verbose: true }); lastMove = h.length > 0 ? h[h.length - 1] : null;
    selectedSq = null; legalTargets = [];
    render(); updateUI();
  });
  
  document.getElementById('btnHint').addEventListener('click', () => {
    if (thinking || isAnimating || chess.game_over() || chess.turn() !== playerColor) return;
    coachTextEl.innerText = 'İpucu hesaplanıyor...';
    setTimeout(() => {
      const saved = difficulty; difficulty = 'hard';
      const best = chooseAIMove(); difficulty = saved;
      if (best) coachTextEl.innerHTML = `Şu hamleyi dene: <b>${best.san || best.from+'->'+best.to}</b>`;
    }, 50);
  });

  render(); updateUI();
</script>
</body>
</html>
